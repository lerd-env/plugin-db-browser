<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Database</title>
  <style>
    /* Layout only: lerd draws the buttons, inputs, cards and table. The tab's
       frame fills the panel, so the card takes the whole viewport. */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; box-sizing: border-box; margin: 0; padding: 0; }
    .browser { flex: 1; min-height: 0; display: flex; overflow: hidden; border: 0; border-radius: 0; }
    .side { flex: 0 0 240px; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--lerd-line); }
    .side .search { padding: 8px; border-bottom: 1px solid var(--lerd-line); }
    .side input { width: 100%; box-sizing: border-box; }
    .tables { flex: 1; min-height: 0; overflow: auto; }
    .tables button { display: flex; align-items: center; gap: 8px; width: 100%; height: auto; padding: 6px 12px; border: 0; border-radius: 0; background: none; text-align: left; justify-content: flex-start; }
    .tables button .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tables button[aria-current="true"] { background: var(--lerd-surface-hover); font-weight: 600; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .main .lerd-toolbar { align-items: center; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--lerd-line); }
    .main .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pager { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .pager input { width: 64px; }
    .grid { flex: 1; min-height: 0; overflow: auto; position: relative; }
    .grid table { width: max-content; min-width: 100%; }
    /* A sticky header needs the card's own fill, or the rows show through it. */
    .grid th { position: sticky; top: 0; z-index: 1; background: var(--lerd-card); box-shadow: inset 0 -1px 0 var(--lerd-line); }
    .grid td { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid td.null { font-style: italic; }
    .grid[aria-busy="true"] table { opacity: 0.4; }
    .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 24px; }
    .grid[aria-busy="true"] .loading { position: absolute; inset: 0; }
    .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lerd-empty { padding: 24px; }
    @media (max-width: 720px) { .browser { flex-direction: column; } .side { flex: 0 0 200px; border-right: 0; border-bottom: 1px solid var(--lerd-line); } }
  </style>
</head>
<body>
  <div class="lerd-card flush browser">
    <div class="side">
      <div class="search"><input id="filter" type="search" placeholder="Filter tables" aria-label="Filter tables" disabled></div>
      <div id="tables" class="tables"></div>
    </div>
    <div class="main">
      <div class="lerd-toolbar">
        <span id="title" class="title lerd-mono"></span>
        <span id="engine" class="lerd-pill" hidden></span>
        <span id="range" class="lerd-muted"></span>
        <label class="pager lerd-muted">Rows <select id="size" aria-label="Rows per page"></select></label>
        <button id="prev" disabled>Previous</button>
        <label class="pager lerd-muted">Page <input id="page" type="number" min="1" value="1" disabled aria-label="Page"> of <span id="pages">1</span></label>
        <button id="next" disabled>Next</button>
      </div>
      <div id="grid" class="grid"></div>
    </div>
  </div>
  <script src="lerd.js"></script>
  <script src="site.js"></script>
</body>
</html>
