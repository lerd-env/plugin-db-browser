<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Database</title>
  <style>
    /* Layout only: lerd draws the buttons, inputs, cards and table. The tab's
       frame fills the panel, so the card takes the whole viewport. */
    html, body { height: 100%; }
    [hidden] { display: none !important; }
    body { display: flex; flex-direction: column; box-sizing: border-box; margin: 0; padding: 0; }
    .browser { flex: 1; min-height: 0; display: flex; overflow: hidden; border: 0; border-radius: 0; }
    .side { flex: 0 0 240px; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--lerd-line); }
    .side .search { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-bottom: 1px solid var(--lerd-line); }
    .side input, .side select { width: 100%; box-sizing: border-box; }
    .side #notice { white-space: normal; }
    .tables { flex: 1; min-height: 0; overflow: auto; }
    .tables button { display: flex; align-items: center; gap: 8px; width: 100%; height: auto; padding: 6px 12px; border: 0; border-radius: 0; background: none; text-align: left; justify-content: flex-start; }
    .tables button .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tables button[aria-current="true"] { background: var(--lerd-surface-hover); font-weight: 600; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .main .lerd-toolbar { align-items: center; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--lerd-line); }
    .main .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dbline { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dbline select, .dbline #dbname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .footer { gap: 8px; margin: 0; padding: 8px 12px; border-top: 1px solid var(--lerd-line); }
    .footer .spacer { flex: 1; }
    .pager { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .pager input { width: 64px; }
    .main .lerd-tabs { margin: 0; }
    .filterbar { gap: 8px; }
    .filterbar input { flex: 1; min-width: 120px; }
    /* The cell panel sits under the rows, across the full width. */
    .content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .grid { flex: 1; min-width: 0; min-height: 0; overflow: auto; position: relative; }
    .grid th { cursor: pointer; user-select: none; white-space: nowrap; }
    .grid td { cursor: pointer; }
    .structure { flex: 1; min-width: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
    /* min-height 0 lets the result scroll, keeping the cell panel on screen. */
    .query { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .query textarea { margin: 12px 12px 0; resize: vertical; min-height: 80px; }
    .qbar { gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--lerd-line); }
    .qbar #qmeta { flex: 1; min-width: 0; }
    .qbar .lerd-tabs { margin: 0; }
    .qresult th { cursor: default; }
    .qresult pre { margin: 0; padding: 12px; white-space: pre; }
    #confirm pre { white-space: pre-wrap; max-height: 200px; overflow: auto; }
    .changesbar { gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--lerd-line); }
    .changesbar .spacer { flex: 1; }
    #changes-error:empty, #confirm-sql:empty { display: none; }
    .grid td.changed { font-weight: 600; }
    .grid tr.deleted td { text-decoration: line-through; opacity: 0.5; }
    .grid tr.inserted td { font-style: italic; }
    .grid td input { width: 100%; box-sizing: border-box; min-width: 120px; }
    .cell-edit { flex: 0 0 340px; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-left: 1px solid var(--lerd-line); overflow: auto; }
    .cell-edit textarea { resize: vertical; }
    .cell { flex: 0 0 240px; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--lerd-line); }
    .cell-body { flex: 1; min-height: 0; display: flex; }
    .cell .lerd-toolbar { border-bottom: 1px solid var(--lerd-line); }
    .cell pre { flex: 1; margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .grid table { width: max-content; min-width: 100%; }
    /* A sticky header needs the card's own fill, or the rows show through it. */
    .grid th { position: sticky; top: 0; z-index: 1; background: var(--lerd-card); box-shadow: inset 0 -1px 0 var(--lerd-line); }
    .grid td { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid td.null { font-style: italic; }
    .grid[aria-busy="true"] table { opacity: 0.4; }
    .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 24px; }
    .grid[aria-busy="true"] .loading { position: absolute; inset: 0; }
    .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lerd-empty { padding: 24px; }
    @media (max-width: 720px) { .browser { flex-direction: column; } .side { flex: 0 0 200px; border-right: 0; border-bottom: 1px solid var(--lerd-line); } }
  </style>
</head>
<body>
  <div class="lerd-card flush browser">
    <div class="side">
      <div class="search">
        <div class="dbline">
          <select id="conn" aria-label="Database" hidden></select>
          <span id="dbname" class="lerd-mono" hidden></span>
          <span id="engine" class="lerd-pill" hidden></span>
        </div>
        <span id="notice" class="lerd-pill warn" hidden></span>
        <button type="button" id="sqlbtn" disabled>SQL query</button>
        <input id="filter" type="search" placeholder="Filter tables" aria-label="Filter tables" disabled>
      </div>
      <div id="tables" class="tables"></div>
    </div>
    <div class="main">
      <div class="lerd-toolbar">
        <span id="title" class="title lerd-mono"></span>
        <div id="views" class="lerd-tabs" role="tablist" hidden>
          <button type="button" role="tab" data-view="data" aria-selected="true">Data</button>
          <button type="button" role="tab" data-view="structure" aria-selected="false">Structure</button>
        </div>
      </div>
      <form id="filterbar" class="lerd-toolbar filterbar" hidden>
        <select id="fcol" aria-label="Filter column"></select>
        <select id="fop" aria-label="Filter operator"></select>
        <input id="fval" type="search" placeholder="Value" aria-label="Filter value">
        <button type="submit" class="primary">Filter</button>
        <button type="button" id="fclear">Clear</button>
        <select id="copyas" aria-label="Copy the rows on this page" title="Copies the rows on this page">
          <option value="">Copy rows as</option>
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
          <option value="sql">SQL INSERT</option>
        </select>
        <span id="readonly" class="lerd-pill" title="Only a table with a primary key can be edited here" hidden>read only</span>
        <button type="button" id="addrow" hidden>Add row</button>
      </form>
      <div id="changes" class="lerd-toolbar changesbar" hidden>
        <span id="changes-count"></span>
        <span id="changes-error" class="lerd-pill bad"></span>
        <span class="spacer"></span>
        <button type="button" id="discard">Discard</button>
        <button type="button" id="commit" class="primary">Commit</button>
      </div>
      <div class="content">
        <div id="grid" class="grid"></div>
        <div id="structure" class="structure" hidden></div>
        <div id="query" class="query" hidden>
          <textarea id="sql" class="lerd-mono" spellcheck="false" rows="7" placeholder="SELECT * FROM ..." aria-label="SQL"></textarea>
          <div class="lerd-toolbar qbar">
            <button type="button" id="run" class="primary" title="Ctrl+Enter">Run</button>
            <select id="history" aria-label="History"><option value="">History</option></select>
            <span id="qmeta" class="lerd-muted"></span>
            <div id="formats" class="lerd-tabs" role="tablist">
              <button type="button" role="tab" data-format="table" aria-selected="true">Table</button>
              <button type="button" role="tab" data-format="json" aria-selected="false">JSON</button>
              <button type="button" role="tab" data-format="text" aria-selected="false">Text</button>
              <button type="button" role="tab" data-format="csv" aria-selected="false">CSV</button>
            </div>
            <button type="button" id="qcopy">Copy</button>
          </div>
          <div id="qresult" class="grid qresult"></div>
        </div>
        <aside id="cell" class="cell" hidden>
          <div class="lerd-toolbar">
            <span id="cell-name" class="title lerd-mono"></span>
            <button type="button" id="cell-copy">Copy</button>
            <button type="button" id="cell-copyrow" hidden>Copy row</button>
            <button type="button" id="cell-close" aria-label="Close">Close</button>
          </div>
          <div class="cell-body">
          <pre id="cell-value" class="lerd-mono"></pre>
          <div id="cell-edit" class="cell-edit" hidden>
            <textarea id="cell-input" class="lerd-mono" rows="4" aria-label="New value"></textarea>
            <label><input type="checkbox" id="cell-null"> NULL</label>
            <div class="lerd-toolbar">
              <button type="button" id="cell-set" class="primary">Set</button>
              <button type="button" id="cell-delete">Delete row</button>
            </div>
          </div>
          </div>
        </aside>
      </div>
      <div id="footer" class="lerd-toolbar footer" hidden>
        <span id="range" class="lerd-muted"></span>
        <span class="spacer"></span>
        <label class="pager lerd-muted">Rows <select id="size" aria-label="Rows per page"></select></label>
        <button id="prev" disabled>Previous</button>
        <label class="pager lerd-muted">Page <input id="page" type="number" min="1" value="1" disabled aria-label="Page"> of <span id="pages">1</span></label>
        <button id="next" disabled>Next</button>
      </div>
    </div>
  </div>
  <dialog id="confirm">
    <p id="confirm-text"></p>
    <pre id="confirm-sql" class="lerd-mono"></pre>
    <div class="lerd-toolbar">
      <button type="button" id="confirm-cancel">Cancel</button>
      <button type="button" id="confirm-run" class="primary">Run</button>
    </div>
  </dialog>
  <script src="lerd.js"></script>
  <script src="format.js"></script>
  <script src="edits.js"></script>
  <script src="site.js"></script>
</body>
</html>
